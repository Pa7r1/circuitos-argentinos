<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e7490" />
    <meta
      name="description"
      content="Descubrí circuitos off-road de enduro, motocross y MTB en Argentina"
    />
    <!--
      La fuente se descubre recién cuando el CSS ya se descargó y se parseó. Con el
      preload arranca junto con el resto y el texto no cambia de forma a mitad de la
      carga. Se puede porque la servimos desde public/ con una URL fija.
    -->
    <link
      rel="preload"
      href="/fonts/archivo-variable-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- los tiles son lo primero que se ve: adelantamos DNS y TLS -->
    <link rel="preconnect" href="https://server.arcgisonline.com" />
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Circuitos Argentinos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
