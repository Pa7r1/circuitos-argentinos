# Publica el frontend como Worker de Cloudflare (assets estáticos) en cada push.
#
# Reemplaza a la integración de Git del panel de Cloudflare, que no disparaba los
# builds. Tampoco usa cloudflare/wrangler-action: esa acción instala wrangler con
# `pnpm add` y en un monorepo muere con ERR_PNPM_ADDING_TO_ROOT.
#
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token con la plantilla "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  id de la cuenta, visible en el panel de Workers
name: Deploy web

on:
  push:
    branches: [main]
    # un cambio solo de la API no necesita republicar el sitio
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# dos pushes seguidos no se pisan: gana el último
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No es un secreto: viaja incrustada en el JavaScript que descarga cualquier
    # visitante. Si falta, el frontend se pide la API a sí mismo, recibe el
    # index.html con estado 200 y el mapa queda vacío sin ningún error visible. La
    # variable del repo permite cambiarla sin tocar código. La usan el build y el
    # cron del Worker que mantiene despierta la API.
    env:
      API_URL: ${{ vars.VITE_API_URL || 'https://circuitos-api.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Compilar el frontend
        env:
          VITE_API_URL: ${{ env.API_URL }}
        run: pnpm --filter web build

      - name: Comprobar que la URL de la API quedó en el bundle
        run: grep -rqF "$API_URL" apps/web/dist/assets

      - name: Publicar el Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy -c apps/web/wrangler.jsonc --var "API_URL:$API_URL"
